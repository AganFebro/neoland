<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>neoland • Mint</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page-mint">
    <header class="nb-header">
      <div class="container row between center">
        <h1 class="logo">neoland</h1>
        <nav class="nav">
          <a href="/" class="nav-link">Home</a>
          <a href="/deploy" class="nav-link">Deploy</a>
          <a href="/mint" class="nav-link">Mint</a>
          <a href="/market" class="nav-link">Market</a>
          <a href="/collection" class="nav-link">Collection</a>
        </nav>
        <div class="row gap center">
          <span id="networkBadge" class="badge" title="Network"></span>
          <button id="connectBtn" class="btn btn-accent">Connect Backpack</button>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="card">
        <div class="toolbar">
          <h3 class="subtitle">Mint</h3>
          <input id="mintSearch" class="input-search" placeholder="Search collections" />
        </div>
        <div id="mintCollections" class="grid"></div>
        <div id="mintPager" class="row gap mt" aria-label="Mint pages"></div>
      </section>
    </main>

    <footer class="container muted small center mt">Participating in CARV Hackathon, website may be unstable.</footer>

    <script type="module" src="/mint.js?v=2"></script>
  </body>
  </html>
